<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Jean-David Zamblezie — web apps and AI agents, shipped not sketched">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2d6b6b" stroke-width="0.6" opacity="0.30"/>
    </pattern>
    <radialGradient id="glow" cx="18%" cy="45%" r="62%">
      <stop offset="0" stop-color="#2d6b6b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2d6b6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff41"/>
      <stop offset="1" stop-color="#2d6b6b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="#0a0a0a"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>

  <rect x="80" y="86" width="6" height="112" rx="3" fill="url(#neon)"/>

  <text x="112" y="140" font-family="Syne, Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#f0f5f5" letter-spacing="-0.5">Jean-David Zamblezie</text>

  <text x="114" y="182" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" fill="#00ff41" letter-spacing="0.2">Web apps &amp; AI agents — shipped, not sketched.</text>

  <line x1="80" y1="228" x2="1120" y2="228" stroke="#2d6b6b" stroke-width="1" opacity="0.55"/>

  <text x="80" y="252" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#6b9e9e">zamblezie.fr</text>

  <circle cx="1120" cy="248" r="4" fill="#00ff41" opacity="0.85"/>
  <text x="1102" y="252" text-anchor="end"
        font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#6b9e9e">Paris</text>
</svg>
